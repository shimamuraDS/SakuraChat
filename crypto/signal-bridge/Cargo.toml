[package]
name = "sakura-signal-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "8fc2113bda042fc972a166a24b974b0d34155c6c" }
async-trait = "0.1"
futures = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[profile.release]
overflow-checks = true
